---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
  labels:
    istio-injection: enabled
spec:
  chart:
    spec:
      chart: ./manifests/dev/monitoring/kube-prometheus-stack
        #chart: kube-prometheus-stack
      reconcileStrategy: ChartVersion
        #version: "77.5.0"
      sourceRef:
        kind: GitRepository
        name: kube-prometheus-stack
  interval: 10s
  install:
    createNamespace: true
  targetNamespace: monitoring
  values:
    fullnameOverride: "fluxcd"
    prometheus: 
      prometheusSpec:
        storageSpec: 
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
    grafana:
      adminUser: admin
      adminPassword: admin123
      plugins:
        - alexanderzobnin-zabbix-app
      grafana.ini:
        server:
          root_url: http://grafana-dev.local

        auth:
          disable_login_form: false

        auth.generic_oauth:
          enabled: true
          name: Keycloak
          allow_sign_up: true
          client_id: grafana
          client_secret: rzd6IwPuAsCQArD3xPURSX0qpwwNXjan
          scopes: openid email profile
          auth_url: http://keycloak-deem.local/realms/deem/protocol/openid-connect/auth
          token_url: http://keycloak-deem.local/realms/deem/protocol/openid-connect/token
          api_url: http://keycloak-deem.local/realms/deem/protocol/openid-connect/userinfo
          role_attribute_path: contains(realm_access.roles[*], 'grafana-admin') && 'Admin' || contains(realm_access.roles[*], 'grafana-editor') && 'Editor' || 'Viewer'
          allow_assign_grafana_admin: true
      datasources.yaml:
        apiVersion: 1
      ingress:
        enabled: true
        hosts:
          - grafana-dev.local
        path: /
        # Uncomment and set if you use a specific ingress class
        ingressClassName: nginx
        annotations: {}
        labels: {}
        tls: []
    datasources:
      enabled: true
      defaultDatasourceEnabled: false
      defaultDashboardsEditable: false
      isDefaultDatasource: false
      name: Prometheus
      uid: prometheus
