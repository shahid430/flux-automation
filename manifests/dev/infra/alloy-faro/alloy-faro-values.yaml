controller:
  type: deployment
  replicas: 1

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: faro
      port: 12347
      targetPort: 12347
      protocol: TCP

alloy:
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      faro.receiver "web" {
        log_format = "json"

        server {
          listen_address       = "0.0.0.0"
          listen_port          = 12347
          cors_allowed_origins = [
            "http://localhost:18080",
            "http://127.0.0.1:18080",
          ]

          rate_limiting {
            enabled    = true
            strategy   = "per_app"
            rate       = 100
            burst_size = 200
          }
        }

        sourcemaps {
          download = false
        }

        output {
          logs   = [loki.write.default.receiver]
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc.cluster.local:4317"

          tls {
            insecure = true
          }
        }
      }