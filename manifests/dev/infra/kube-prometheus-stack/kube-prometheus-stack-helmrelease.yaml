apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10s
  targetNamespace: monitoring
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./manifests/dev/infra/kube-prometheus-stack
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system

  values:
    fullnameOverride: fluxcd

    prometheus:
      prometheusSpec:
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi

    grafana:
      assertNoLeakedSecrets: false
      adminUser: admin
      adminPassword: Welcome@123
      plugins:
        - alexanderzobnin-zabbix-app
      grafana.ini:
        server:
          root_url: "https://grafana-dev.local/"
        auth:
          disable_login_form: false
        auth.generic_oauth:
          enabled: true
          verbose_logging: true
          name: Keycloak
          allow_sign_up: true
          client_id: grafana
          client_secret: R7LVoqjBghAMRGmJsol2TR4UNZB9396R
          scopes: openid email profile
          auth_url: http://192.168.49.2:30080/realms/grafana/protocol/openid-connect/auth
          token_url: http://keycloak.keycloak.svc.cluster.local/realms/grafana/protocol/openid-connect/token
          api_url: http://keycloak.keycloak.svc.cluster.local/realms/grafana/protocol/openid-connect/userinfo
          role_attribute_path: "contains(realm_access.roles[*], 'admin') && 'Admin' || 'Viewer'"
          login_attribute_path: preferred_username
          name_attribute_path: name
          email_attribute_path: email

      ingress:
        enabled: true
        ingressClassName: traefik-traefik
        hosts:
          - grafana-dev.local
        path: /
        annotations: {}
        tls: []

      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local
          isDefault: false
          editable: true
          jsonData:
            maxLines: 1000
