---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: keycloak
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/shahid430/flux-automation
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: flux-system
spec:
  interval: 10m
  install:
    createNamespace: true
  targetNamespace: auth

  chart:
    spec:
      chart: ./manifests/dev/infra/keycloak
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
      reconcileStrategy: ChartVersion

  values:
    global:
      postgresql:
        auth:
          password: KeycloakDB@12345

    auth:
      adminUser: admin
      adminPassword: Admin@12345

    image:
      registry: docker.io
      repository: bitnamilegacy/keycloak
      tag: 26.3.3-debian-12-r0

    postgresql:
      enabled: true
      auth:
        username: bn_keycloak
        password: KeycloakDB@12345
        database: bitnami_keycloak
        postgresPassword: PostgresRoot@12345
      image:
        registry: docker.io
        repository: bitnamilegacy/postgresql
        tag: 17.6.0-debian-12-r0
    proxyHeaders: xforwarded
    httpEnabled: true

    extraEnvVars:
      - name: KC_HOSTNAME
        value: keycloak-deem.local
      - name: KC_HOSTNAME_STRICT
        value: "false"
      - name: KC_HTTP_ENABLED
        value: "true"
      - name: KC_PROXY_HEADERS
        value: xforwarded

    ingress:
      enabled: true
      ingressClassName: traefik-traefik
      hostname: keycloak-deem.local
      path: /
      pathType: Prefix
      tls: true
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: keycloak-deem-selfsigned
        cert-manager.io/cluster-issuer: keycloak-deem-selfsigned
