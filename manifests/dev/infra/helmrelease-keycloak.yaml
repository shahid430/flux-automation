---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: keycloak
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/shahid430/flux-automation
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: flux-system
  annotations:
    reconcile.fluxcd.io/requestedAt: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
spec:
  chart:
    spec:
      chart: manifests/dev/infra/keycloak
      sourceRef:
        kind: GitRepository
        name: keycloak
      reconcileStrategy: ChartVersion
  interval: 10m
  install:
    createNamespace: true
  targetNamespace: auth
  values:
    auth:
  adminUser: admin
  adminPassword: Admin@12345

postgresql:
  enabled: true
  auth:
    username: bn_keycloak
    password: KeycloakDB@12345
    database: bitnami_keycloak
    postgresPassword: PostgresRoot@12345

    proxyHeaders: xforwarded
    httpEnabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/keycloak
      tag: 26.3.3-debian-12-r0
    postgresql:
      image:
        registry: docker.io
        repository: bitnamilegacy/postgresql
        tag: 17.6.0-debian-12-r0

